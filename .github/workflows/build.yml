name: Build Custom Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: pix106/kernel_xiaomi_predator-4.19
        ref: 4.19-stable

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev clang gcc-aarch64-linux-gnu

    - name: Edit Defconfig (Non-KSU + Fixes)
      run: |
        DEFCONFIG="arch/arm64/configs/lavender_defconfig"
        sed -i '/CONFIG_KSU=y/d' $DEFCONFIG
        sed -i '/CONFIG_KSU_SUSFS=y/d' $DEFCONFIG
        echo "CONFIG_UCLAMP_TASK=y" >> $DEFCONFIG
        echo "CONFIG_UCLAMP_TASK_GROUP=y" >> $DEFCONFIG
        echo "CONFIG_SCHED_TUNE=y" >> $DEFCONFIG
        echo "CONFIG_SCHED_BOOST=y" >> $DEFCONFIG

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        make O=out lavender_defconfig
        make O=out -j$(nproc)

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master anykernel
        cp out/arch/arm64/boot/Image.gz-dtb anykernel/
        cd anykernel
        sed -i 's/device.name1=.*/device.name1=lavender/' anykernel.sh
        sed -i 's/kernel.string=.*/kernel.string=MyCustomKernel by Kali/' anykernel.sh
        zip -r9 ../MyCustom-Kernel-Lavender.zip * -x .git README.md *placeholder

    - name: Upload Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Custom-Kernel-Zip
        path: MyCustom-Kernel-Lavender.zip
